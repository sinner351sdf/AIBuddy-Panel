name: publish-release

# Publish a successful tag build without rebuilding or moving the existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        type: string
      build_run_id:
        description: 'Successful build.yml run for exactly this tag'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sinner351sdf/AIBuddy-Panel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 校验 tag、版本和发布说明
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+-(?:aibuddy\.\d+(?:-beta\.\d+)?|beta\.\d+-aibuddy\.\d+)', tag), '无效的定制版 tag'
          assert re.fullmatch(r'[1-9]\d*', os.environ['BUILD_RUN_ID']), '无效的构建编号'
          def source(path):
              return subprocess.check_output(['git', 'show', f'{tag}:{path}']).decode()
          sha = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}']).decode().strip()
          version = json.loads(source('desktop-tauri/src-tauri/tauri.conf.json'))['version']
          assert tag.startswith(f'v{version}-'), 'tag 与安装包版本不一致'
          for path in ('package.json', 'desktop-tauri/package.json'):
              assert json.loads(source(path))['version'] == version
          for path in ('desktop-tauri/src-tauri/Cargo.toml', 'desktop-tauri/src-tauri/server/Cargo.toml'):
              assert re.search(r'^version = "([^"]+)"', source(path), re.M)[1] == version
          notes = source(f'docs/releases/{tag}.zh-CN.md')
          title = notes.splitlines()[0].removeprefix('# ').strip()
          assert title.startswith(f'AIBuddy Panel {version}'), '发布说明标题与版本不一致'
          notes += '\n\n## 本次发布附件\n\nWindows x64、macOS Universal、Linux 桌面包及 Linux amd64／arm64 服务端包来自同一 tag 的成功 CI 构建；3.1.0 起另含 Windows amd64 服务端 ZIP。附件包含服务端分包 SHA256 和总校验文件。macOS 包未进行 Developer ID 签名和公证。安装包构建不等同于所有平台的实机安装或真实提供商验收；Docker 镜像与 Android APK 不属于本次 Release 附件。\n'
          assert 1000 < len(notes) <= 4000, '发布说明长度不符合要求'
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'EXPECTED_SHA={sha}\n')
              out.write(f'RELEASE_TITLE={title}\n')
          PYTHON

      - name: 核对成功构建及四个平台附件来源
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/release-build.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" > "$RUNNER_TEMP/release-artifacts.json"
          node scripts/release-assets.mjs run "$RUNNER_TEMP/release-build.json" "$RUNNER_TEMP/release-artifacts.json" "$EXPECTED_SHA" "$TAG" "$GITHUB_REPOSITORY"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-build.json').read_text())
          assert run['path'] == '.github/workflows/build.yml', '只接受独立安装包工作流'
          assert run['head_branch'] == os.environ['TAG'] and run['event'] == 'push', '构建不是该 tag 的推送构建'
          PYTHON

      - name: 下载并校验安装包
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          node scripts/release-assets.mjs assets "$RUNNER_TEMP/release-assets" "$TAG" > "$RUNNER_TEMP/release-assets.list"

      - name: 挂载附件并发布正式 Release
        run: |
          mapfile -d '' -t assets < "$RUNNER_TEMP/release-assets.list"
          test "${#assets[@]}" -ge 7
          prerelease=$(node --input-type=module -e 'const m=await import("./scripts/release-assets.mjs"); console.log(m.isPrereleaseTag(process.argv[1]))' "$TAG")
          # Never overwrite the attachments of an already published release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = json.loads(Path(os.environ['RUNNER_TEMP'], 'existing-release.json').read_text())
          assert release['isDraft'], '正式 Release 已存在；停止以避免覆盖已发布附件'
          PYTHON
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          latest=true
          if [ "$prerelease" = true ]; then latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease" --latest="$latest" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: 验证 latest、说明及所有下载地址
        run: |
          prerelease=$(node --input-type=module -e 'const m=await import("./scripts/release-assets.mjs"); console.log(m.isPrereleaseTag(process.argv[1]))' "$TAG")
          endpoint=latest
          if [ "$prerelease" = true ]; then endpoint="tags/$TAG"; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$endpoint" > "$RUNNER_TEMP/release-latest.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-latest.json').read_text())
          assert release['tag_name'] == os.environ['TAG'] and not release['draft']
          beta = bool(__import__('re').search(r'(?:-|\.)(?:alpha|beta|rc)(?:[.\-]|$)', os.environ['TAG']))
          assert release['prerelease'] == beta
          assert release['body'] == Path(os.environ['RUNNER_TEMP'], 'release-notes.md').read_text()
          names = [a['name'] for a in release['assets']]
          version = tuple(map(int, os.environ['TAG'].split('-')[0][1:].split('.')))
          expected = 11 if version >= (3, 1, 0) else (9 if version >= (3, 0, 8) else 7)
          assert len(names) == expected and len(set(names)) == expected
          if version >= (3, 0, 8):
              assert sum(n.endswith('.deb') for n in names) == 1 and sum(n.endswith('.AppImage') for n in names) == 1
          assert sum(n.endswith('.exe') for n in names) == 1 and sum(n.endswith('.dmg') for n in names) == 1
          assert all(f'agent2api-server-linux-{arch}.tar.gz{suffix}' in names for arch in ('amd64', 'arm64') for suffix in ('', '.sha256'))
          if version >= (3, 1, 0):
              assert all(f'agent2api-server-windows-amd64.zip{suffix}' in names for suffix in ('', '.sha256'))
          assert 'SHA256SUMS.txt' in names and all(a['size'] > 0 for a in release['assets'])
          for asset in release['assets']:
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--head', asset['browser_download_url']], check=True, stdout=subprocess.DEVNULL)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('正式 Release 已发布：' + release['html_url'] + '\n')
              out.write('latest、累计升级说明、全部附件和下载地址已验证。\n')
          print(release['html_url'])
          PYTHON
