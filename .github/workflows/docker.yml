name: docker

# 仅发布到私有 GHCR；不使用 Docker Hub 凭据。
# tag 示例：v3.0.2-aibuddy.1，保留上游版本并区分定制发行版。
# 新包默认私有；已存在的包必须是 private，发布后再次确认。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '可选：版本号，例如 3.0.2-aibuddy.1；基础版本必须匹配 Cargo，留空发布 dev'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: private-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验发布版本
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -n "$version" ]; then
            actual=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/src-tauri/server/Cargo.toml | head -1)
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] && [ "${version%%-*}" = "$actual" ] || { echo '发布版本的基础版本必须与检出的服务端版本一致'; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: 确认目标包未公开
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-ghcr-private.py --allow-missing

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=v${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=dev,enable=${{ steps.release.outputs.version == '' }}

      - name: 构建并推送
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证已发布镜像仍为私有
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-ghcr-private.py

      - name: 记录发布结果
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## 私有 GHCR 发布完成'
            echo "镜像：$IMAGE"
            echo "摘要：$DIGEST"
            echo '架构：linux/amd64、linux/arm64'
            echo '已验证包的 visibility=private，匿名访问被拒绝。'
          } >> "$GITHUB_STEP_SUMMARY"
