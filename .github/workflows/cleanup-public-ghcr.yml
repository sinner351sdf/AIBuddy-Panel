name: cleanup-accidental-public-ghcr

# 只清理本次首次发行误创建的公开包，严格核对摘要、标签和创建时间。
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-public-ghcr.yml]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    if: github.repository == 'sinner351sdf/AIBuddy-Panel'
    runs-on: ubuntu-latest
    steps:
      - name: 清理本次误创建的公开镜像包
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          root = 'https://api.github.com/users/sinner351sdf/packages/container/aibuddy-panel'
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)
          package = get(root)
          versions = get(root + '/versions?per_page=100')
          cutoff = datetime.datetime.fromisoformat('2026-10-13T14:55:57+00:00')
          created = lambda item: datetime.datetime.fromisoformat(item['created_at'].replace('Z', '+00:00'))
          assert package['name'] == 'aibuddy-panel' and package['visibility'] == 'public', '包不是本次创建的公开目标，停止清理'
          assert created(package) >= cutoff, '包在本次发布前已经存在，停止清理'
          expected = {'3.0.2-aibuddy.1', 'v3.0.2-aibuddy.1', 'latest'}
          digest = 'sha256:97ae3ceefff33cce41fe0b0baa79a1150cd2a63a33697247a706e8a311584d52'
          seen = set()
          assert versions and len(versions) < 100, '版本列表不完整，停止清理'
          for version in versions:
              tags = set(version['metadata']['container']['tags'])
              assert created(version) >= cutoff and tags <= expected, '发现不属于本次发行的版本，停止清理'
              if tags:
                  assert version['name'] == digest, '发行摘要不匹配，停止清理'
              seen |= tags
          assert seen == expected, '发行标签不匹配，停止清理'
          with urllib.request.urlopen(urllib.request.Request(root, headers=headers, method='DELETE'), timeout=30) as response:
              assert response.status == 204
          print('已删除本次误创建的公开包 aibuddy-panel。')
          PY
