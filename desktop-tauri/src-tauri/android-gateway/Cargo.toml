[package]
name = "aibuddy-android-gateway"
version = "3.1.0"
edition = "2021"
rust-version = "1.88"
license-file = "../../../LICENSE"

[lib]
name = "aibuddy_gateway"
crate-type = ["cdylib", "rlib"]

[dependencies]
agent2api-server = { path = "../server" }
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
