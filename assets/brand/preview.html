<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent2API · 品牌 Logo 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .hero { background:linear-gradient(160deg,#202020 0%,#111111 55%,#101010 100%); padding:64px 72px 56px; }
  .hero .tag { color:#cccccc; font-size:13px; letter-spacing:.28em; text-transform:uppercase; margin-bottom:28px; font-weight:600; }
  .hero img.lockup { width:640px; display:block; }
  .hero .stacked-row { display:flex; align-items:flex-end; gap:64px; margin-top:56px; }
  .hero .stacked-row img.st { height:190px; }
  .light { background:#f7f7f7; padding:56px 72px 64px; }
  .light .tag { color:#111111; font-size:13px; letter-spacing:.28em; text-transform:uppercase; margin-bottom:28px; font-weight:600; }
  .light img.lockup { width:640px; display:block; }
  .light .stacked-row { display:flex; align-items:flex-end; gap:64px; margin-top:48px; }
  .light .stacked-row img.st { height:190px; }
  .sizes { display:flex; align-items:flex-end; gap:36px; margin-top:48px; }
  .sizes .item { text-align:center; }
  .sizes img { display:block; margin:0 auto 10px; }
  .sizes .cap { font-size:12px; color:#777777; }
  /* panel sidebar mock */
  .mocks { display:flex; gap:40px; margin-top:56px; }
  .sidebar { width:280px; border-radius:16px; background:#ffffff; border:1px solid #e5e5e5; box-shadow:0 12px 32px -18px rgba(0,0,0,.15); overflow:hidden; }
  .sidebar .brand { display:flex; align-items:center; gap:12px; padding:16px 18px; }
  .sidebar .brand img { width:34px; height:34px; border-radius:9px; }
  .sidebar .brand .t1 { font-size:15.5px; font-weight:700; color:#111111; }
  .sidebar .brand .t2 { font-size:11px; color:#cccccc; font-weight:600; letter-spacing:.06em; }
  .sidebar .nav { padding:6px 10px 16px; }
  .sidebar .nav div { padding:9px 12px; border-radius:9px; font-size:13.5px; color:#555555; margin-bottom:2px; }
  .sidebar .nav div.on { background:#eeeeee; color:#111111; font-weight:600; }
  .tabbar { flex:1; border-radius:16px; background:#ffffff; border:1px solid #e5e5e5; box-shadow:0 12px 32px -18px rgba(0,0,0,.15); overflow:hidden; }
  .tabbar .tabs { display:flex; background:#eeeeee; padding:8px 12px 0; gap:6px; }
  .tabbar .tab { display:flex; align-items:center; gap:8px; background:#fff; border-radius:10px 10px 0 0; padding:9px 16px; font-size:13px; color:#111111; font-weight:600; width:230px; }
  .tabbar .tab img { width:16px; height:16px; }
  .tabbar .tab .x { margin-left:auto; color:#aaaaaa; font-weight:400; }
  .tabbar .page { padding:26px; }
  .tabbar .page .h { font-size:19px; font-weight:700; color:#111111; display:flex; align-items:center; gap:10px; }
  .tabbar .page .h img { width:26px; height:26px; border-radius:7px; }
  .tabbar .page .sub { color:#777777; font-size:13px; margin-top:6px; }
  .tabbar .page .cards { display:flex; gap:14px; margin-top:20px; }
  .tabbar .page .c { flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:14px; }
  .tabbar .page .c .k { font-size:12px; color:#777777; }
  .tabbar .page .c .v { font-size:20px; font-weight:700; color:#111111; margin-top:4px; }
  .darkbar { width:280px; border-radius:16px; background:#111111; border:1px solid #303030; overflow:hidden; }
  .darkbar .brand { display:flex; align-items:center; gap:12px; padding:16px 18px; }
  .darkbar .brand img { width:34px; height:34px; border-radius:9px; }
  .darkbar .brand .t1 { font-size:15.5px; font-weight:700; color:#f7f7f7; }
  .darkbar .brand .t2 { font-size:11px; color:#cccccc; font-weight:600; letter-spacing:.06em; }
  .darkbar .nav { padding:6px 10px 16px; }
  .darkbar .nav div { padding:9px 12px; border-radius:9px; font-size:13.5px; color:#aaaaaa; margin-bottom:2px; }
  .darkbar .nav div.on { background:#303030; color:#ffffff; font-weight:600; }
</style>
</head>
<body>
  <div class="hero">
    <div class="tag">Brand Preview · Dark</div>
    <img class="lockup" src="png/logo-horizontal-dark@2x.png">
    <div class="stacked-row">
      <img class="st" src="png/logo-icon-512.png">
      <img class="st" src="png/logo-stacked-dark@2x.png">
    </div>
  </div>
  <div class="light">
    <div class="tag">Brand Preview · Light</div>
    <img class="lockup" src="png/logo-horizontal@2x.png">
    <div class="sizes">
      <div class="item"><img src="png/logo-icon-512.png" width="96"><div class="cap">512</div></div>
      <div class="item"><img src="png/logo-icon-128.png" width="64"><div class="cap">128</div></div>
      <div class="item"><img src="png/logo-icon-64.png" width="40"><div class="cap">64</div></div>
      <div class="item"><img src="png/logo-icon-32.png" width="24"><div class="cap">32</div></div>
    </div>
    <div class="mocks">
      <div class="sidebar">
        <div class="brand">
          <img src="png/logo-icon-128.png">
          <div><div class="t1">Agent2API</div><div class="t2">v2.10.0</div></div>
        </div>
        <div class="nav">
          <div class="on">网关概览</div><div>提供商账号</div><div>模型管理</div><div>请求报表</div><div>设置</div>
        </div>
      </div>
      <div class="tabbar">
        <div class="tabs">
          <div class="tab"><img src="png/logo-icon-32.png">Agent2API<span class="x">✕</span></div>
        </div>
        <div class="page">
          <div class="h"><img src="png/logo-icon-128.png">Agent2API</div>
          <div class="sub">多提供商 AI 网关 · 面包屑与登录页同样应用品牌 Logo</div>
          <div class="cards">
            <div class="c"><div class="k">今日请求</div><div class="v">1,284</div></div>
            <div class="c"><div class="k">活跃提供商</div><div class="v">7</div></div>
            <div class="c"><div class="k">成功率</div><div class="v">99.2%</div></div>
          </div>
        </div>
      </div>
      <div class="darkbar">
        <div class="brand">
          <img src="png/logo-icon-128.png">
          <div><div class="t1">Agent2API</div><div class="t2">v2.10.0</div></div>
        </div>
        <div class="nav">
          <div class="on">网关概览</div><div>提供商账号</div><div>模型管理</div><div>设置</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
